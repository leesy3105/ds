<style>
  html,body{background:#F7F8FA;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1f2330;font-size:16px;}
  .inp{width:100%;border:1px solid #E2E5EC;border-radius:10px;padding:9px 12px;font-size:15px;background:#fff;outline:none;transition:border .15s, box-shadow .15s;}

  .btn-p{background:#5B4BDB;color:#fff;} .btn-p:hover:not(:disabled){background:#4a3bc6;}
  .btn-g{background:#22B573;color:#fff;} .btn-g:hover:not(:disabled){background:#1c9c62;}

<script>/* 인스타그램 카드뉴스 생성기 (원본 index.html 내장) */
window.CARDNEWS_HTML = "<!doctype html>\n<html lang=\"ko\" data-theme=\"light\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>카드뉴스 메이커<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\"><\/script>\n<style>\n/* Layout: 왼쪽 작업 패널(주제·옵션·브랜드) + 오른쪽 카드 미리보기 그리드. 좁은 화면에서는 위아래로 쌓임 */\n:root{\n  --bg:#F5F6F4; --panel:#FFFFFF; --fg:#1B2420; --muted:#5D6A63; --line:#DDE2DE;\n  --accent:#1F5E45; --accent-fg:#FFFFFF; --soft:#E7F0EB; --warn:#9A4B14;\n  --ui:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;\n  --display:'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#121614; --panel:#1A201D; --fg:#E7ECE9; --muted:#9AA8A0; --line:#2C3531;\n  --accent:#5CB78F; --accent-fg:#0E1512; --soft:#1F2D26; --warn:#E4A36B; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#121614; --panel:#1A201D; --fg:#E7ECE9; --muted:#9AA8A0; --line:#2C3531;\n  --accent:#5CB78F; --accent-fg:#0E1512; --soft:#1F2D26; --warn:#E4A36B; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.55;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}\n.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}\nheader.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}\nheader.top h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;letter-spacing:-.01em;line-height:1.1}\nheader.top p{margin:4px 0 0;color:var(--muted)}\n.grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}\n@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}\n.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}\n@media (max-width:900px){.side{position:static}}\n.panel h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0;font-weight:700}\nlabel{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}\nlabel small{color:var(--muted);font-weight:400}\ninput[type=text],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}\ntextarea{resize:vertical;min-height:64px}\ninput:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.topic{font-size:17px;font-weight:700;padding:12px 13px}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.check{flex-direction:row;align-items:center;gap:8px;font-weight:400}\nbutton{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 13px;font-weight:500}\nbutton:hover{border-color:var(--accent)}\nbutton:disabled{opacity:.5;cursor:default}\n.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;padding:12px 16px;font-size:16px}\n.primary:hover{filter:brightness(1.07)}\n.status{font-size:14px;color:var(--muted);min-height:1.4em}\n.status.err{color:var(--warn)}\n.themes{display:flex;flex-wrap:wrap;gap:8px}\n.sw{width:42px;height:42px;border-radius:50%;padding:0;border:2px solid var(--line);position:relative;overflow:hidden}\n.sw[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}\n.sw i{position:absolute;right:6px;bottom:6px;width:12px;height:12px;border-radius:50%}\ndetails.brand summary{cursor:pointer;font-weight:700;font-size:14px}\ndetails.brand[open] summary{margin-bottom:10px}\ndetails.brand .fields{display:flex;flex-direction:column;gap:10px}\n.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}\n.toolbar .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}\n.toolbar h2{font-size:18px;margin:0;color:var(--fg);letter-spacing:0;font-weight:700;overflow-wrap:anywhere}\n.badge{font-size:12px;font-weight:700;background:var(--soft);color:var(--accent);padding:3px 9px;border-radius:99px}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}\n.card{display:flex;flex-direction:column;gap:8px;min-width:0}\n.card img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);background:var(--line)}\n.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--muted)}\n.card .acts{display:flex;gap:4px}\n.card .acts button{padding:3px 8px;font-size:13px}\n.card details summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--accent)}\n.card details .f{display:flex;flex-direction:column;gap:8px;margin-top:8px}\n.card details label{font-size:13px}\n.add{border:1.5px dashed var(--line);border-radius:8px;min-height:120px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:12px}\n.caption{white-space:pre-wrap}\n.hint{font-size:13px;color:var(--muted);margin:0}\n.copyrow{display:flex;gap:8px;flex-wrap:wrap}\n@media (prefers-reduced-motion:no-preference){.card img{transition:opacity .2s}}\n.busy .card img{opacity:.5}\n.manual{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:10px;padding:12px}\n.btnlink{display:inline-block;text-decoration:none;border-radius:9px;border:1px solid var(--accent);background:var(--panel);color:var(--accent);padding:8px 13px;font-weight:700}\n<\/style>\n<style>header.top h1{display:none}:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}<\/style>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header class=\"top\">\n    <div>\n      <h1>카드뉴스 메이커<\/h1>\n      <p>주제를 입력하면 AI가 문구를 쓰고 인스타그램 카드(1080px)로 만들어 드려요. 문구는 카드별로 직접 고칠 수 있어요.<\/p>\n    <\/div>\n  <\/header>\n\n  <div class=\"grid\">\n    <aside class=\"panel side\" aria-label=\"만들기 설정\">\n      <label for=\"topic\">주제\n        <input type=\"text\" id=\"topic\" class=\"topic\" placeholder=\"예: 전세 계약 전 꼭 확인할 것\" maxlength=\"80\">\n      <\/label>\n      <div class=\"row\">\n        <label for=\"count\">카드 장수\n          <select id=\"count\"><option>5<\/option><option>6<\/option><option selected>7<\/option><option>8<\/option><option>9<\/option><option>10<\/option><\/select>\n        <\/label>\n        <label for=\"tone\">말투\n          <select id=\"tone\"><option value=\"친근하고 쉬운 말투(해요체)\">친근하게<\/option><option value=\"신뢰감 있는 전문가 말투(합니다체)\">전문가답게<\/option><option value=\"짧고 임팩트 있는 말투(명사형 종결)\">짧고 강하게<\/option><\/select>\n        <\/label>\n      <\/div>\n      <label for=\"audience\">누가 볼까요? <small>선택<\/small>\n        <input type=\"text\" id=\"audience\" placeholder=\"예: 신혼부부, 첫 집 구하는 직장인\">\n      <\/label>\n      <label for=\"extra\">추가 요청 <small>선택<\/small>\n        <textarea id=\"extra\" placeholder=\"예: 경주역 신도시 이야기를 넣어줘 / 숫자보다 체크리스트 위주로\"><\/textarea>\n      <\/label>\n      <label class=\"check\" for=\"promo\"><input type=\"checkbox\" id=\"promo\" checked> 마지막 장에 사무소 문의 안내 넣기<\/label>\n      <button class=\"primary\" id=\"gen\">카드뉴스 만들기<\/button>\n      <div class=\"status\" id=\"status\" role=\"status\"><\/div>\n      <div id=\"manualBox\" class=\"manual\" hidden>\n        <p class=\"hint\"><b>API 키 없이 만들기<\/b><br>① 요청문이 복사됐어요. 아래 버튼으로 Claude를 열고 붙여넣기(Ctrl+V) 후 보내세요.<br>② Claude의 답을 통째로 복사해서 아래 칸에 붙여넣고 '카드에 적용'을 누르세요.<\/p>\n        <div class=\"copyrow\">\n          <a class=\"btnlink\" href=\"https://claude.ai/new\" target=\"_blank\" rel=\"noopener\">Claude 열기 ↗<\/a>\n          <button id=\"recopy\" type=\"button\">요청문 다시 복사<\/button>\n        <\/div>\n        <textarea id=\"pasteAns\" rows=\"5\" placeholder=\"Claude의 답을 여기에 붙여넣기\"><\/textarea>\n        <button class=\"primary\" id=\"applyAns\" type=\"button\">카드에 적용<\/button>\n      <\/div>\n      <details id=\"keyBox\" class=\"brand\" hidden>\n        <summary>API 키가 있다면 (선택)<\/summary>\n        <label for=\"apikey\">Claude API 키 <small>넣으면 버튼 한 번에 자동으로 만들어요. 이 브라우저에만 저장돼요.<\/small>\n          <input type=\"password\" id=\"apikey\" placeholder=\"sk-ant-...\" autocomplete=\"off\">\n        <\/label>\n      <\/details>\n\n      <h2>디자인<\/h2>\n      <div class=\"themes\" id=\"themes\" role=\"group\" aria-label=\"색상 테마\"><\/div>\n      <div class=\"row\">\n        <label for=\"tfont\">제목 글꼴\n          <select id=\"tfont\"><option value=\"bhs\">블랙한산스<\/option><option value=\"gothic\">고딕 굵게<\/option><option value=\"serif\">명조 굵게<\/option><\/select>\n        <\/label>\n        <label for=\"ratio\">비율\n          <select id=\"ratio\"><option value=\"1350\">4:5 세로 (권장)<\/option><option value=\"1080\">1:1 정사각<\/option><\/select>\n        <\/label>\n      <\/div>\n\n      <details class=\"brand\" id=\"brandBox\">\n        <summary>사무소 정보 (마지막 장·하단 표기)<\/summary>\n        <div class=\"fields\">\n          <label for=\"b_short\">카드 하단 표기<input type=\"text\" id=\"b_short\"><\/label>\n          <label for=\"b_name\">사무소명<input type=\"text\" id=\"b_name\"><\/label>\n          <label for=\"b_person\">대표<input type=\"text\" id=\"b_person\"><\/label>\n          <label for=\"b_phone\">연락처<input type=\"text\" id=\"b_phone\"><\/label>\n          <label for=\"b_loc\">위치<input type=\"text\" id=\"b_loc\"><\/label>\n        <\/div>\n      <\/details>\n    <\/aside>\n\n    <main class=\"panel\" aria-label=\"카드 미리보기\">\n      <div class=\"toolbar\">\n        <div class=\"l\"><h2 id=\"deckTitle\">예시 카드뉴스<\/h2><span class=\"badge\" id=\"exBadge\">예시<\/span><\/div>\n        <div class=\"l\">\n          <button id=\"zipBtn\">전체 저장 (ZIP)<\/button>\n        <\/div>\n      <\/div>\n      <p class=\"hint\" id=\"saveHint\">카드 아래 '문구 고치기'를 누르면 바로 수정돼요. 저장이 안 되는 화면에서는 이미지를 길게 누르거나 우클릭해 저장하세요.<\/p>\n      <div class=\"cards\" id=\"cards\"><\/div>\n\n      <h2>인스타그램 본문 · 해시태그<\/h2>\n      <textarea id=\"caption\" class=\"caption\" rows=\"6\" aria-label=\"본문\"><\/textarea>\n      <textarea id=\"tags\" rows=\"3\" aria-label=\"해시태그\"><\/textarea>\n      <div class=\"copyrow\">\n        <button id=\"copyAll\">본문+해시태그 복사<\/button>\n        <span class=\"status\" id=\"copyStatus\"><\/span>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n\n<script>\n(() => {\n\"use strict\";\nconst W = 1080;\nconst THEMES = {\n  green: {name:\"신도시 그린\", bg:\"#1E3B2C\", fg:\"#F6F1E4\", sub:\"#BFCBB9\", accent:\"#E9C46A\", accentFg:\"#1E3B2C\", box:\"#284B39\", ctaBg:\"#E9C46A\", ctaFg:\"#1E3B2C\", ctaBox:\"#1E3B2C\", ctaBoxFg:\"#F6F1E4\"},\n  white: {name:\"클린 화이트\", bg:\"#FFFFFF\", fg:\"#13284A\", sub:\"#5B6B84\", accent:\"#E2572B\", accentFg:\"#FFFFFF\", box:\"#F1F4F9\", ctaBg:\"#13284A\", ctaFg:\"#FFFFFF\", ctaBox:\"#FFFFFF\", ctaBoxFg:\"#13284A\"},\n  blue:  {name:\"블루 데이\", bg:\"#2350C8\", fg:\"#FFFFFF\", sub:\"#C9D6FA\", accent:\"#FFD84D\", accentFg:\"#1A2E6E\", box:\"#1C43AE\", ctaBg:\"#FFD84D\", ctaFg:\"#1A2E6E\", ctaBox:\"#2350C8\", ctaBoxFg:\"#FFFFFF\"},\n  beige: {name:\"웜 베이지\", bg:\"#F2E9DA\", fg:\"#3A2A1D\", sub:\"#7D6A58\", accent:\"#B9532E\", accentFg:\"#FFFFFF\", box:\"#E7DAC4\", ctaBg:\"#3A2A1D\", ctaFg:\"#F2E9DA\", ctaBox:\"#F2E9DA\", ctaBoxFg:\"#3A2A1D\"},\n  charcoal:{name:\"차콜\", bg:\"#1D1F23\", fg:\"#F4F4F2\", sub:\"#A7ABB2\", accent:\"#FF8A3D\", accentFg:\"#1D1F23\", box:\"#2A2D33\", ctaBg:\"#FF8A3D\", ctaFg:\"#1D1F23\", ctaBox:\"#1D1F23\", ctaBoxFg:\"#F4F4F2\"}\n};\nconst TFONTS = {\n  bhs: {fam:\"'Black Han Sans','Noto Sans KR',sans-serif\", w:\"400\", lh:1.22},\n  gothic: {fam:\"'Noto Sans KR',sans-serif\", w:\"900\", lh:1.28},\n  serif: {fam:\"'Noto Serif KR',serif\", w:\"900\", lh:1.32}\n};\nconst BODY = \"'Noto Sans KR',sans-serif\";\nconst DEFAULT_BRAND = {\n  short:\"부동산is · 경주역신도시부동산\",\n  name:\"부동산이즈경주역신도시부동산공인중개사사무소\",\n  person:\"대표 공인중개사 이선예\",\n  phone:\"010-4176-3654 · 054-776-3654\",\n  loc:\"신경주유보라 104동 앞\"\n};\nconst EXAMPLE = {\n  topic:\"신혼부부 첫 집 구할 때 꼭 확인할 5가지\",\n  slides:[\n    {type:\"cover\", kicker:\"첫 집 체크리스트\", title:\"신혼부부 **첫 집** 구할 때 꼭 확인할 5가지\", subtitle:\"계약하기 전에 이것만은 챙기세요\"},\n    {type:\"content\", title:\"**대출 한도**부터 확인\", body:\"- 집 보러 가기 전에 은행 상담 먼저\\n- 소득·신용에 따라 한도가 달라요\\n- 정책대출 자격도 함께 알아보기\", point:\"예산이 정해져야 집이 보여요\"},\n    {type:\"content\", title:\"출퇴근 **동선** 따져보기\", body:\"- 두 사람 직장까지 실제 시간 재기\\n- 출근 시간대에 직접 다녀보기\\n- 역·IC 접근성도 함께 체크\", point:\"\"},\n    {type:\"content\", title:\"**등기부등본** 확인\", body:\"- 집주인과 계약하는 사람이 같은지\\n- 근저당·압류 같은 권리관계\\n- 계약 당일에 한 번 더 발급\", point:\"잔금 전날에도 다시 확인하세요\"},\n    {type:\"content\", title:\"관리비·생활비 **계산**\", body:\"- 평형별 관리비 차이 물어보기\\n- 겨울철 난방비도 꼭 확인\\n- 주차 대수와 추가 비용\", point:\"\"},\n    {type:\"content\", title:\"**아이 계획**까지 생각하기\", body:\"- 어린이집·초등학교까지 거리\\n- 놀이터·공원 가까운지\\n- 몇 년 살 집인지 미리 정하기\", point:\"\"},\n    {type:\"cta\", title:\"내 조건에 맞는 집, 같이 찾아드려요\", body:\"예산·동선·생활까지 함께 따져보고 꼭 맞는 집을 추천해 드립니다.\"}\n  ],\n  caption:\"첫 집, 설레지만 막막하죠? 🏡\\n계약 전에 꼭 확인해야 할 5가지를 정리했어요.\\n저장해 두고 집 보러 갈 때 하나씩 체크해 보세요.\\n궁금한 점은 편하게 문의 주세요!\",\n  hashtags:[\"신혼집\",\"신혼부부\",\"첫집마련\",\"내집마련\",\"아파트매매\",\"부동산팁\",\"등기부등본\",\"경주역신도시\",\"신경주\",\"경주아파트\",\"경주부동산\",\"집구하기\"]\n};\n\nconst $ = id => document.getElementById(id);\nconst store = {\n  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },\n  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }\n};\n\nlet state = store.get(\"cn_state\") || {\n  topic: EXAMPLE.topic, isExample:true, slides: JSON.parse(JSON.stringify(EXAMPLE.slides)),\n  caption: EXAMPLE.caption, hashtags: EXAMPLE.hashtags.slice(), theme:\"green\", tfont:\"bhs\", ratio:1350\n};\nlet brand = Object.assign({}, DEFAULT_BRAND, store.get(\"cn_brand\") || {});\nif (brand.name === \"경주역신도시부동산 공인중개사사무소\") { brand.name = DEFAULT_BRAND.name; store.set(\"cn_brand\", brand); }\nconst save = () => store.set(\"cn_state\", state);\n\n/* ---------- 텍스트 레이아웃 ---------- */\nfunction tokens(text){ // \"**강조**\" 파싱 → 줄 배열(단어 토큰)\n  const paras = String(text||\"\").split(\"\\n\");\n  return paras.map(p => {\n    const out = []; let hl = false;\n    p.split(\"**\").forEach((seg, idx) => {\n      if (idx > 0) hl = !hl;\n      seg.split(/(\\s+)/).forEach(w => {\n        if (!w) return;\n        if (/^\\s+$/.test(w)) { out.push({sp:true}); return; }\n        out.push({t:w, hl});\n      });\n    });\n    return out;\n  });\n}\nfunction wrapRich(ctx, text, maxW){\n  const lines = [];\n  const spW = ctx.measureText(\" \").width;\n  for (const para of tokens(text)) {\n    let line = [], x = 0, pendingSp = false;\n    const push = () => { lines.push(line); line = []; x = 0; pendingSp = false; };\n    for (const tk of para) {\n      if (tk.sp) { if (line.length) pendingSp = true; continue; }\n      let w = ctx.measureText(tk.t).width;\n      const add = pendingSp ? spW : 0;\n      if (line.length && x + add + w > maxW) push();\n      if (w > maxW) { // 긴 단어는 글자 단위로 쪼갬\n        let buf = \"\";\n        for (const ch of tk.t) {\n          if (ctx.measureText(buf + ch).width > maxW - x && (buf || line.length)) {\n            if (buf) line.push({t:buf, hl:tk.hl, w:ctx.measureText(buf).width, gap:0});\n            push(); buf = \"\";\n          }\n          buf += ch;\n        }\n        tk.t = buf; w = ctx.measureText(buf).width;\n      }\n      line.push({t:tk.t, hl:tk.hl, w, gap: line.length && pendingSp ? spW : 0});\n      x += (line.length > 1 && pendingSp ? spW : 0) + w; pendingSp = false;\n    }\n    push();\n  }\n  while (lines.length && !lines[lines.length-1].length) lines.pop();\n  return lines;\n}\nfunction lineWidth(l){ return l.reduce((a,p)=>a+p.gap+p.w,0); }\nfunction drawLines(ctx, lines, x, y, lhPx, col, hlCol, align){\n  lines.forEach((l, i) => {\n    let cx = align === \"center\" ? x - lineWidth(l)/2 : x;\n    for (const p of l) { cx += p.gap; ctx.fillStyle = p.hl ? hlCol : col; ctx.fillText(p.t, cx, y + i*lhPx); cx += p.w; }\n  });\n  return y + lines.length * lhPx;\n}\nfunction fitRich(ctx, text, fontFn, maxSize, minSize, maxW, maxH, lh){\n  let size = maxSize, lines;\n  for (; size >= minSize; size -= 2) {\n    ctx.font = fontFn(size);\n    lines = wrapRich(ctx, text, maxW);\n    if (lines.length * size * lh <= maxH) break;\n  }\n  if (size < minSize) { size = minSize; ctx.font = fontFn(size); lines = wrapRich(ctx, text, maxW); }\n  return {size, lines, h: lines.length*size*lh};\n}\nfunction rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }\n\n/* ---------- 카드 그리기 ---------- */\nfunction drawSlide(canvas, s, i, n){\n  const H = Number(state.ratio) || 1350;\n  canvas.width = W; canvas.height = H;\n  const ctx = canvas.getContext(\"2d\");\n  const T = THEMES[state.theme] || THEMES.green;\n  const F = TFONTS[state.tfont] || TFONTS.bhs;\n  const tf = sz => `${F.w} ${sz}px ${F.fam}`;\n  const P = 96, CW = W - P*2;\n  ctx.textBaseline = \"top\";\n  const isCta = s.type === \"cta\";\n  const bg = isCta ? T.ctaBg : T.bg, fg = isCta ? T.ctaFg : T.fg;\n  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);\n\n  // 하단 표기\n  const footY = H - P + 20;\n  ctx.font = `500 28px ${BODY}`;\n  ctx.fillStyle = isCta ? fg : T.sub; ctx.globalAlpha = isCta ? .75 : 1;\n  ctx.fillText(brand.short || \"\", P, footY);\n  const pg = `${i+1} / ${n}`;\n  ctx.font = `700 28px ${BODY}`;\n  ctx.fillText(pg, W - P - ctx.measureText(pg).width, footY);\n  ctx.globalAlpha = 1;\n  const bottomLimit = footY - 40;\n\n  if (s.type === \"cover\") {\n    // 장식: 오른쪽 위 겹친 원\n    ctx.save(); ctx.globalAlpha = .9; ctx.strokeStyle = T.accent; ctx.lineWidth = 34;\n    ctx.beginPath(); ctx.arc(W - 70, 120, 230, 0, Math.PI*2); ctx.stroke();\n    ctx.globalAlpha = .35; ctx.lineWidth = 12;\n    ctx.beginPath(); ctx.arc(W - 70, 120, 330, 0, Math.PI*2); ctx.stroke(); ctx.restore();\n    let y = H * 0.25;\n    if (s.kicker) {\n      ctx.font = `700 34px ${BODY}`;\n      const kw = ctx.measureText(s.kicker).width;\n      ctx.fillStyle = T.accent; rr(ctx, P, y, kw + 48, 64, 32); ctx.fill();\n      ctx.fillStyle = T.accentFg; ctx.fillText(s.kicker, P + 24, y + 13);\n      y += 64 + 44;\n    }\n    const subH = s.subtitle ? 140 : 0;\n    const t = fitRich(ctx, s.title, tf, 112, 64, CW, bottomLimit - y - subH - 60, F.lh);\n    ctx.font = tf(t.size);\n    y = drawLines(ctx, t.lines, P, y, t.size*F.lh, fg, T.accent);\n    if (s.subtitle) {\n      y += 36;\n      ctx.fillStyle = T.accent; ctx.fillRect(P, y, 90, 8); y += 40;\n      const st = fitRich(ctx, s.subtitle, z=>`500 ${z}px ${BODY}`, 42, 30, CW, 120, 1.45);\n      ctx.font = `500 ${st.size}px ${BODY}`;\n      drawLines(ctx, st.lines, P, y, st.size*1.45, T.sub, T.accent);\n    }\n    ctx.font = `700 30px ${BODY}`; ctx.fillStyle = T.accent;\n    const sw = \"옆으로 넘겨보세요  →\";\n    ctx.fillText(sw, W - P - ctx.measureText(sw).width, footY - 70);\n    return;\n  }\n\n  if (isCta) {\n    let y = P + 40;\n    ctx.font = `700 34px ${BODY}`; ctx.fillStyle = fg; ctx.globalAlpha = .8;\n    ctx.fillText(s.kicker || \"더 궁금하다면\", P, y); ctx.globalAlpha = 1; y += 80;\n    const t = fitRich(ctx, s.title, tf, 92, 56, CW, H*0.3, F.lh);\n    ctx.font = tf(t.size); y = drawLines(ctx, t.lines, P, y, t.size*F.lh, fg, fg);\n    y += 36;\n    if (s.body) {\n      const b = fitRich(ctx, s.body, z=>`500 ${z}px ${BODY}`, 40, 30, CW, H*0.18, 1.5);\n      ctx.font = `500 ${b.size}px ${BODY}`; y = drawLines(ctx, b.lines, P, y, b.size*1.5, fg, fg);\n    }\n    const rows = [brand.person, brand.phone, brand.loc].filter(Boolean);\n    if (brand.name || rows.length) {\n      const boxH = 70 + (brand.name ? 64 : 0) + rows.length*58 + 30;\n      const by = Math.max(y + 50, bottomLimit - boxH);\n      ctx.fillStyle = T.ctaBox; rr(ctx, P - 8, by, CW + 16, boxH, 28); ctx.fill();\n      let yy = by + 50;\n      if (brand.name) {\n        const nm = fitRich(ctx, brand.name, z=>`900 ${z}px ${BODY}`, 44, 28, CW - 80, 60, 1.2);\n        ctx.font = `900 ${nm.size}px ${BODY}`; ctx.fillStyle = T.ctaBoxFg; ctx.fillText(brand.name, P + 36, yy); yy += 74;\n      }\n      ctx.font = `500 34px ${BODY}`;\n      rows.forEach(r => { ctx.fillStyle = T.ctaBg; ctx.beginPath(); ctx.arc(P + 44, yy + 20, 7, 0, Math.PI*2); ctx.fill();\n        ctx.fillStyle = T.ctaBoxFg; ctx.fillText(r, P + 70, yy); yy += 58; });\n    }\n    return;\n  }\n\n  // content\n  let y = P + 10;\n  ctx.font = `400 76px 'Black Han Sans',${BODY}`; ctx.fillStyle = T.accent;\n  ctx.fillText(String(i).padStart(2,\"0\"), P, y); y += 76 + 40;\n  const pointH = s.point ? 190 : 0;\n  const t = fitRich(ctx, s.title, tf, 80, 52, CW, H*0.24, F.lh);\n  ctx.font = tf(t.size); y = drawLines(ctx, t.lines, P, y, t.size*F.lh, T.fg, T.accent);\n  y += 34; ctx.fillStyle = T.accent; ctx.fillRect(P, y, 70, 7); y += 60;\n  const bodyMax = bottomLimit - y - (pointH ? pointH + 40 : 0);\n  // 본문(불릿)\n  const raw = String(s.body||\"\").split(\"\\n\").map(l=>l.trim()).filter(Boolean);\n  const items = raw.map(l => { const m = l.match(/^([-•·*]|\\d+[.)])\\s*/); return {b: !!m, t: m ? l.slice(m[0].length) : l}; });\n  let size = 52, laid;\n  const lh = 1.5, ind = 46, gapItem = 0.55;\n  for (; size >= 30; size -= 2) {\n    ctx.font = `500 ${size}px ${BODY}`;\n    laid = items.map(it => ({...it, lines: wrapRich(ctx, it.t, CW - (it.b ? ind : 0))}));\n    const h = laid.reduce((a,it)=>a + it.lines.length*size*lh, 0) + Math.max(0,laid.length-1)*size*gapItem;\n    if (h <= bodyMax) break;\n  }\n  size = Math.max(size, 30); ctx.font = `500 ${size}px ${BODY}`;\n  for (const it of laid || []) {\n    if (it.b) { ctx.fillStyle = T.accent; ctx.beginPath(); ctx.arc(P + 12, y + size*0.62, 9, 0, Math.PI*2); ctx.fill(); }\n    y = drawLines(ctx, it.lines, P + (it.b ? ind : 0), y, size*lh, T.fg, T.accent) + size*gapItem;\n  }\n  if (s.point) {\n    const by = bottomLimit - pointH;\n    ctx.fillStyle = T.box; rr(ctx, P - 8, by, CW + 16, pointH, 26); ctx.fill();\n    ctx.font = `900 26px ${BODY}`; ctx.fillStyle = T.accent; ctx.fillText(\"POINT\", P + 32, by + 34);\n    const pt = fitRich(ctx, s.point, z=>`700 ${z}px ${BODY}`, 40, 28, CW - 64, pointH - 90, 1.35);\n    ctx.font = `700 ${pt.size}px ${BODY}`;\n    drawLines(ctx, pt.lines, P + 32, by + 80, pt.size*1.35, T.fg, T.accent);\n  }\n}\n\n/* ---------- 화면 ---------- */\nconst cardsEl = $(\"cards\");\nconst cvs = document.createElement(\"canvas\");\nfunction renderImg(img, i){\n  drawSlide(cvs, state.slides[i], i, state.slides.length);\n  img.src = cvs.toDataURL(\"image/png\");\n}\nconst FIELDS = {\n  cover: [[\"kicker\",\"상단 태그\",false],[\"title\",\"제목 (**강조**)\",true],[\"subtitle\",\"부제\",true]],\n  content: [[\"title\",\"제목 (**강조**)\",true],[\"body\",\"본문 (줄마다 - 로 시작)\",true],[\"point\",\"POINT 한 줄 (비우면 숨김)\",false]],\n  cta: [[\"kicker\",\"상단 문구\",false],[\"title\",\"제목\",true],[\"body\",\"설명\",true]]\n};\nconst TYPE_NAME = {cover:\"표지\", content:\"내용\", cta:\"마무리\"};\nlet editingOpen = new Set();\nfunction renderAll(){\n  cardsEl.innerHTML = \"\";\n  const n = state.slides.length;\n  state.slides.forEach((s, i) => {\n    const card = document.createElement(\"div\"); card.className = \"card\";\n    const img = document.createElement(\"img\"); img.alt = `${i+1}번 카드: ${String(s.title||\"\").replace(/\\*\\*/g,\"\")}`;\n    renderImg(img, i);\n    const meta = document.createElement(\"div\"); meta.className = \"meta\";\n    const lbl = document.createElement(\"span\"); lbl.textContent = `${i+1}. ${TYPE_NAME[s.type]||\"내용\"}`;\n    const acts = document.createElement(\"div /* ===================== 말투 변환 ===================== */
const TONE_MAP = {
  '해요': [['하겠습니다', '할게요'], ['합니다', '해요'], ['입니다', '이에요'], ['있습니다', '있어요'], ['없습니다', '없어요'], ['됩니다', '돼요'], ['드립니다', '드려요'], ['좋습니다', '좋아요'], ['바랍니다', '바라요']],
  '한다': [['하겠습니다', '하겠다'], ['합니다', '한다'], ['입니다', '이다'], ['있습니다', '있다'], ['없습니다', '없다'], ['됩니다', '된다'], ['드립니다', '드린다'], ['좋습니다', '좋다'], ['바랍니다', '바란다']],
  '과거형': [['합니다', '했습니다'], ['입니다', '이었습니다'], ['있습니다', '있었습니다'], ['없습니다', '없었습니다'], ['됩니다', '되었습니다'], ['드립니다', '드렸습니다'], ['좋습니다', '좋았습니다']],
};
function applyTone(text, tone) {
  const map = TONE_MAP[tone]; if (!map) return text;
  return text.split('\n').map(line => {
    if (line.trim().startsWith('|')) return line;
    let l = line; map.forEach(([a, b]) => { l = l.replace(new RegExp(a + '(?=[.!,)\\s]|$)', 'g'), b); }); return l;
  }).join('\n');
}

    } else if (i === expIdx) {

/* ===================== 품질 평가 엔진 ===================== */
const CATS = [
  ['intent', '검색 의도 및 독자 목적 부합도', 15], ['acc', '정보 정확성 및 출처 명시', 15], ['exp', '전문성 및 현장 독창성', 20],

  ['fresh', '최신성 및 기준일 명시', 5], ['img', '인포그래픽/이미지 배치 구성', 5], ['auth', '진정성 및 상업성/스팸 억제', 5],

function evaluate({ body, f, o, imgCount, cardMade }) {
  const text = body || ''; const plain = toPlain(text);
  const cnt = re => (text.match(re) || []).length;
  const expPh = cnt(PH_EXP), chkPh = cnt(PH_CHK);
  const tables = parseTables(text); const tRows = tables.length ? Math.max(...tables.map(t => t.length)) : 0;
  const headings = cnt(/^■/gm), faq = cnt(/^Q[.:]/gm), srcN = cnt(/\(출처:/g);
  const first = plain.slice(0, 450); const topicHead = (f.topic || '').slice(0, 5);
  const sc = {}; const note = {};
  // 1
  let s1 = 0; if (topicHead && plain.includes(topicHead)) s1 += 4;
  if (f.keywords.some(k => first.includes(k))) s1 += 4; else if (topicHead && first.includes(topicHead)) s1 += 2;
  if (/분|독자|위한|입장|궁금/.test(first)) s1 += 3; s1 += faq >= 3 ? 4 : faq > 0 ? 2 : 0;
  sc.intent = Math.min(15, s1); note.intent = `FAQ ${faq}개 · 도입부 키워드 ${f.keywords.some(k => first.includes(k)) ? '있음' : '없음'}`;
  // 2
  let s2 = srcN >= 3 ? 11 : srcN === 2 ? 9 : srcN === 1 ? 6 : 2;
  if ((f.refs || []).some(r => r.name)) s2 += 2; if ((f.refs || []).some(r => r.url)) s2 += 2;
  sc.acc = Math.min(15, s2); note.acc = `출처 표기 ${srcN}건 · 참고자료 ${(f.refs || []).filter(r => r.name).length}건`;
  // 3
  const expLen = (f.experience || '').trim().length; let s3 = 6 + (expLen >= 300 ? 8 : expLen >= 80 ? 6 : expLen > 0 ? 3 : 0);
  if (/공인중개사|중개사무소/.test(text) || (f.author && text.includes(f.author))) s3 += 3;
  if (/상담|현장|답사|계약|실측/.test(plain)) s3 += 3;
  sc.exp = Math.min(20, s3); note.exp = `경험 메모 ${expLen}자`;
  // 4
  sc.table = tables.length ? (tRows >= 4 ? 15 : 13) : 6; note.table = tables.length ? `비교표 ${tables.length}개 (최대 ${tRows}행)` : '비교표 없음 (-9점)';
  // 5
  const title = o ? o.titles[o.sel] : f.title; const tl = (title || '').length;
  let s5 = (tl >= 15 && tl <= 40 ? 4 : tl ? 2 : 0) + (headings >= 4 ? 3 : headings >= 2 ? 2 : 0);
  const paras = plain.split('\n').filter(x => x.trim()); const avg = paras.length ? paras.reduce((a, b) => a + b.length, 0) / paras.length : 999;
  s5 += avg <= 120 ? 3 : avg <= 200 ? 2 : 1;
  sc.read = Math.min(10, s5); note.read = `제목 ${tl}자 · 소제목 ${headings}개 · 문단 평균 ${Math.round(avg)}자`;
  // 6
  let s6;
  if (!f.keywords.length) { s6 = 4; note.kw = '키워드 미입력'; }
  else {
    const per = f.keywords.map(k => { const n = plain.split(k).length - 1; return { k, n, v: n >= 2 && n <= 10 ? 1 : n === 1 ? 0.6 : n > 10 && n <= 15 ? 0.6 : n > 15 ? 0.2 : 0 }; });
    s6 = Math.round(per.reduce((a, b) => a + b.v, 0) / per.length * 8) + (f.keywords.some(k => (title || '').includes(k)) ? 2 : 0);
    note.kw = per.map(p => `${p.k} ${p.n}회`).join(' · ');

  // 8
  sc.img = Math.min(5, (imgCount >= 3 ? 4 : imgCount === 2 ? 3 : imgCount === 1 ? 2 : 1) + (cardMade ? 1 : 0)); note.img = `사진 ${imgCount}장 · 카드뉴스 ${cardMade ? '생성' : '미생성'}`;
  // 9
  const spam = ['무조건', '100%', '상위노출 보장', '대박', '최저가 보장', '절대 손해', '지금 아니면'].filter(w => plain.includes(w)).length;
  const cta = cnt(/문의|연락 주세요|전화 주세요/g);
  sc.auth = Math.max(0, 5 - spam * 2 - (cta > 5 ? 1 : 0)); note.auth = `과장 표현 ${spam}건 · 문의 유도 ${cta}회`;
  const raw = CATS.reduce((a, [k]) => a + sc[k], 0);
  const ded = expPh * 2 + chkPh; const total = Math.max(0, raw - ded);
  const grade = total >= 90 ? { t: '발행 권장', c: '#22B573', bg: '#E8F8F0' } : total >= 80 ? { t: '보관/보완 권장', c: '#E8890C', bg: '#FFF4E5' } : { t: '재작성 권장', c: '#E5484D', bg: '#FDECEC' };
  // 개선 제안
  const sug = [];
  if (expPh) sug.push({ t: `작성자 경험 자리표시 ${expPh}건 채우기 (-${expPh * 2}점)`, d: '현장 답사일, 실측 정보, 실제 상담 사례를 직접 입력하면 전문성과 독창성 점수가 크게 오릅니다.', fb: '[작성자 경험 입력] 자리표시 위치에 들어갈 문장 틀을 제안하되, 실제 경험은 지어내지 말고 작성자가 채울 질문 목록으로 남겨 주세요.' });
  if (chkPh) sug.push({ t: `확인 필요 항목 ${chkPh}건 검증하기 (-${chkPh}점)`, d: '공식 발표·법령 원문에서 수치를 확인해 [확인 필요] 표시를 실제 값과 출처로 바꾸세요.', fb: '[확인 필요] 항목마다 확인해야 할 공식 출처(기관명·자료명)를 괄호로 덧붙이고, 확실하지 않은 수치는 그대로 [확인 필요]로 유지해 주세요.' });
  const order = CATS.map(([k, name, max]) => ({ k, name, max, r: sc[k] / max })).filter(x => x.r < 1).sort((a, b) => a.r - b.r);
  const TIP = {
    intent: ['도입부에 독자와 상황을 분명히', '도입부 첫 2문장에 핵심 키워드와 "누가, 왜 읽는가"를 넣고 FAQ를 3개로 맞추세요.'],
    acc: ['출처 표기 늘리기', '수치·정책 문장 뒤에 (출처: 기관명, 날짜)를 3건 이상 붙이고 참고자료 URL을 입력하세요.'],
    exp: ['현장 경험 보강', '경험 메모에 실제 상담·답사 내용을 80자 이상 적고 본문에 반영하세요.'],
    table: ['비교표 추가·확장', '대안 3가지를 4행 이상 비교하는 표를 넣으세요.'],
    read: ['제목·구조 다듬기', '제목을 15~40자로 맞추고, 소제목 4개 이상·짧은 문단으로 나누세요.'],
    kw: ['키워드 배치 조정', '핵심 키워드를 제목에 1회, 본문에 2~10회 자연스럽게 배치하세요.'],
    fresh: ['기준일 최신화', '정보 기준일을 최근 날짜로 갱신하고 본문 첫 줄에 표기하세요.'],
    img: ['이미지 구성 보강', '소제목마다 사진을 넣고 카드뉴스를 1장 이상 만들어 첨부하세요.'],
    auth: ['영업 문구 줄이기', '과장 표현을 빼고 문의 유도는 글 끝 1~2회로 줄이세요.'],
  };
  order.forEach(x => { if (sug.length < 3) sug.push({ t: TIP[x.k][0], d: TIP[x.k][1], fb: TIP[x.k][1] }); });

}

async function callClaude(key, model, prompt) {
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model, max_tokens: 8000, messages: [{ role: 'user', content: prompt }] }),
    });
  } catch (e) { throw new Error('외부 연결이 차단되었어요. Claude 화면 안에서는 API 호출이 막혀 있으니, 저장된 HTML 파일을 브라우저(크롬 등)로 직접 열어 사용하세요.'); }
  if (!r.ok) { let m = 'HTTP ' + r.status; try { const j = await r.json(); m += ' — ' + ((j.error && j.error.message) || ''); } catch (e) {} throw new Error(m); }
  const j = await r.json(); return (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
}

/* ===================== Step 3 ===================== */
function Counter({ text }) {
  const all = text.length; const noSp = text.replace(/\s/g, '').length; const b = byteLen(text);
  return (<div className="text-xs sm:text-sm font-bold text-gray-600 bg-[#F7F8FA] rounded-lg px-3 py-2">공백 포함 <span className="text-[#5B4BDB]">{all.toLocaleString()}</span>자 | <span className="text-[#5B4BDB]">{b.toLocaleString()}</span> byte <span className="font-normal text-gray-400">(한글 2byte, 영문 1byte)</span> / 공백 제외 <span className="text-[#5B4BDB]">{noSp.toLocaleString()}</span>자</div>);
}
function Step3({ form, outline, body, setBody, images, setImages, cardMade, setCardMade, onGen, busy, apiReady, notify, openModal, saveArchive, ev, apiKey, model, runImprove }) {
  const [tab, setTab] = useState('edit');

  const plain = useMemo(() => fullPlain(body, form), [body, form]);
  const title = outline ? outline.titles[outline.sel] : (form.title || form.topic);
  const meta = outline ? outline.meta : '';
  const tags = hashtags(form);
  const phCount = ev.expPh + ev.chkPh;
  const jumpNext = () => {
    const ta = taRef.current; if (!ta) return; const from = ta.selectionEnd || 0; const re = /\[(작성자 경험 입력|확인 필요)[^\]]*\]/g;
    let m, first = null, hit = null; while ((m = re.exec(body))) { if (!first) first = m; if (m.index >= from) { hit = m; break; } }
    hit = hit || first; if (!hit) return; ta.focus(); ta.setSelectionRange(hit.index, hit.index + hit[0].length);
    const lineNo = body.slice(0, hit.index).split('\n').length; ta.scrollTop = Math.max(0, (lineNo - 3) * 28);
  };
  const doNaverCopy = async () => { const ok = await copyHtml(fullHtml(body, form, images, true), plain); notify(ok ? '네이버 블로그용 서식이 복사되었어요. 스마트에디터에 붙여넣으세요.' : '복사에 실패했어요. [텍스트만 복사]를 이용해 주세요.', ok ? 'ok' : 'err'); };
  const naverCopy = () => {
    if (phCount > 0) openModal({ type: 'confirm', title: '미완성 항목이 남아 있어요', msg: `미완성 항목 ${phCount}건 존재 (확인 필요 ${ev.chkPh}건 · 작성자 경험 입력 ${ev.expPh}건). 그대로 복사하면 노란/주황색 표시까지 함께 붙여넣어집니다.`, okText: '그대로 복사', onOk: doNaverCopy, cancelText: '돌아가서 수정', onCancel: () => { setTab('edit'); setTimeout(jumpNext, 50); } });
    else doNaverCopy();
  };
  const cp = async (t, msg) => { const ok = await copyText(t); notify(ok ? msg : '복사에 실패했어요', ok ? 'ok' : 'err'); };

function ImageTools({ form, outline, body, headings, images, setImages, setCardMade, notify }) {

    });

        <div className="flex gap-2 mt-1"><a className="text-xs font-bold text-[#5B4BDB] underline" href={`https://unsplash.com/s/photos/${encodeURIComponent(k.q)}`} target="_blank" rel="noopener">Unsplash</a><a className="text-xs font-bold text-[#5B4BDB] underline" href={`https://www.pexels.com/search/${encodeURIComponent(k.q)}/`} target="_blank" rel="noopener">Pexels</a></div>
      </div>); })}</div> : <p className="text-sm text-gray-400">본문에 ■ 소제목이 생기면 추천이 표시됩니다.</p>}

      <div className="rounded-lg overflow-hidden border border-[#ECEEF3] [&>svg]:w-full [&>svg]:h-auto" dangerouslySetInnerHTML={{ __html: svg }} />
      <div className="flex gap-2 mt-3"><button className="btn btn-p flex-1 justify-center" onClick={makePng}><Icon n="dl" />PNG 다운로드</button>{png && <button className="btn btn-o" onClick={copyPng}><Icon n="copy" />이미지 복사</button>}</div>
      {png && <div className="mt-3"><p className="text-xs text-gray-400 mb-1">생성된 PNG (우클릭 → 다른 이름으로 저장 가능)</p><img src={png.url} className="w-full rounded-lg border border-[#ECEEF3]" /></div>}
    </div>
  </div>);
}

function Archive({ archive, setArchive, onLoad, notify }) {
  const [q, setQ] = useState('');
  const list = archive.filter(a => !q || (a.title + a.keywords.join(' ')).includes(q));
  const json = () => JSON.stringify(archive, null, 2);
  const importJson = e => { const file = e.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { try { const arr = JSON.parse(r.result); if (!Array.isArray(arr)) throw 0; setArchive(a => { const ids = new Set(a.map(x => x.id)); return [...arr.filter(x => x && x.id && !ids.has(x.id)), ...a]; }); notify(`${arr.length}건을 가져왔어요`); } catch (er) { notify('JSON 형식이 올바르지 않아요', 'err'); } }; r.readAsText(file); e.target.value = ''; };
  return (<div className="space-y-4">
    <div className="card p-4 flex flex-wrap gap-2 items-center">
      <div className="relative flex-1 min-w-[200px]"><Icon n="search" s={16} c="absolute left-3 top-3 text-gray-400" /><input className="inp !pl-9" placeholder="제목·키워드 검색" value={q} onChange={e => setQ(e.target.value)} /></div>
      <button className="btn btn-o" onClick={async () => { const ok = await copyText(json()); notify(ok ? '보관함 JSON이 복사되었어요' : '복사 실패', ok ? 'ok' : 'err'); }}><Icon n="copy" />JSON 복사</button>
      <button className="btn btn-o" onClick={() => { download(`블로그보관함_${today()}.json`, json(), 'application/json'); notify('JSON 다운로드를 시작했어요'); }}><Icon n="dl" />JSON 내보내기</button>
      <label className="btn btn-o cursor-pointer"><Icon n="upload" />JSON 가져오기<input type="file" accept=".json,application/json" className="hidden" onChange={importJson} /></label>
    </div>
    {list.length === 0 ? <div className="card p-12 text-center text-gray-400"><Icon n="archive" s={36} c="mx-auto mb-3" />보관된 글이 없어요. Step 3에서 [보관함에 저장]을 눌러 보세요.</div> :
      <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">{list.map(a => { const g = a.score >= 90 ? '#22B573' : a.score >= 80 ? '#E8890C' : '#E5484D'; return (<div key={a.id} className="card p-4 flex flex-col">
        <div className="flex justify-between gap-2"><p className="font-extrabold leading-snug">{a.title}</p><span className="text-lg font-extrabold" style={{ color: g }}>{a.score}</span></div>
        <p className="text-xs text-gray-400 mt-1">{new Date(a.date).toLocaleString('ko-KR')} · {toPlain(a.body).length.toLocaleString()}자</p>
        <div className="flex flex-wrap gap-1 mt-2 flex-1">{a.keywords.map(k => <span key={k} className="text-[11px] font-bold bg-[#F1EFFF] text-[#5B4BDB] px-1.5 py-0.5 rounded-full h-fit">#{k}</span>)}</div>
        <div className="flex gap-2 mt-3"><button className="btn btn-p btn-s flex-1 justify-center" onClick={() => onLoad(a)}>불러오기</button>
          <button className="btn btn-o btn-s" onClick={async () => { const ok = await copyText(toPlain(a.body)); notify(ok ? '본문이 복사되었어요' : '복사 실패'); }}><Icon n="copy" s={13} /></button>
          <button className="btn btn-o btn-s text-red-500" onClick={() => setArchive(x => x.filter(y => y.id !== a.id))}><Icon n="trash" s={13} /></button></div>
      </div>); })}</div>}
  </div>);
}

function CardNews({ apiKey, active }) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current && !ref.current.getAttribute('srcdoc')) ref.current.srcdoc = window.CARDNEWS_HTML; }, []);
  const syncKey = () => { try { const d = ref.current && ref.current.contentDocument; const el = d && d.getElementById('apikey'); if (el && !el.value && apiKey) el.value = apiKey; } catch (e) {} };
  useEffect(syncKey, [apiKey]);
  return (<iframe ref={ref} title="카드뉴스 생성기" onLoad={syncKey} allow="clipboard-read; clipboard-write"
    style={{ display: active ? 'block' : 'none', width: '100%', border: 0, background: '#F5F6F4', height: 'calc(100vh - 66px)', minHeight: 640 }} />);
}

  const [modal, setModal] = useState(null);
  const [busy, setBusy] = useState('');
  const [navOpen, setNavOpen] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const [pasteVal, setPasteVal] = useState('');
  const [keyDraft, setKeyDraft] = useState('');
  const [cardOpened, setCardOpened] = useState(false);
  useEffect(() => { if (view === 'card') setCardOpened(true); }, [view]);

  useEffect(() => { const t = setTimeout(() => { if (lsSet(LS_KEY, { step, form, outline, body })) setSavedAt(new Date()); }, 500); return () => clearTimeout(t); }, [step, form, outline, body]);
  useEffect(() => { if (!lsSet(ARCH_KEY, archive)) notifyFn('브라우저 저장 공간이 부족해요. 오래된 글을 정리하거나 JSON으로 내보내세요.', 'err'); }, [archive]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3400); return () => clearTimeout(t); }, [toast]);
  function notifyFn(msg, kind = 'ok') { setToast({ msg, kind, id: Date.now() }); }
  const notify = notifyFn;

  const ev = useMemo(() => evaluate({ body, f: form, o: outline, imgCount: images.length, cardMade }), [body, form, outline, images.length, cardMade]);

  const applyResult = (kind, txt) => {
    if (kind === 'outline') { const o = parseOutline(txt, form); if (!o) { notify('JSON을 읽지 못했어요. AI 답변의 { } 부분이 모두 들어갔는지 확인하세요.', 'err'); return false; } setOutline(o); setStep(2); notify('아웃라인이 적용되었어요'); return true; }
    const b = normalizeBody(txt, form); if (b.replace(/정보 기준일.*$/m, '').trim().length < 50) { notify('본문이 너무 짧아요. 결과 전체를 붙여넣어 주세요.', 'err'); return false; }
    setBody(b); setStep(3); notify('본문이 적용되었어요'); return true;
  };
  const onGen = async (kind, method) => {
    if (kind === 'outline' && !form.topic.trim()) { notify('주제를 먼저 입력하세요', 'err'); return; }
    const prompt = kind === 'outline' ? outlinePrompt(form) : bodyPrompt(form, outline);
    if (method === 'sim') {
      if (kind === 'outline') { setOutline(simOutline(form)); setStep(2); notify('샘플 아웃라인을 만들었어요'); }
      else { setBody(simBody(form, outline || simOutline(form))); setStep(3); notify('샘플 본문을 만들었어요. 노란색·주황색 표시를 채워 주세요.'); }
      return;
    }
    if (method === 'paste') { setPasteVal(''); setModal({ type: 'paste', kind, prompt }); return; }
    if (!apiKey) { setKeyDraft(''); setModal({ type: 'settings' }); return; }
    setBusy(kind);
    try { const txt = await callClaude(apiKey, model, prompt); applyResult(kind, txt); } catch (e) { notify('API 호출 실패: ' + e.message, 'err'); } finally { setBusy(''); }
  };
  const runImprove = async fb => {
    setBusy('body');
    try { const txt = await callClaude(apiKey, model, improvePrompt(fb, form, body)); applyResult('body', txt); } catch (e) { notify('API 호출 실패: ' + e.message, 'err'); } finally { setBusy(''); }
  };
  const openModal = m => { if (m.type === 'paste') setPasteVal(''); setModal(m); };
  const saveArchive = () => {
    if (!body.trim()) { notify('저장할 본문이 없어요', 'err'); return; }
    const title = outline ? outline.titles[outline.sel] : (form.title || form.topic);
    setArchive(a => [{ id: uid(), title, date: new Date().toISOString(), body, score: ev.total, keywords: form.keywords, form, outline }, ...a]);
    notify('보관함에 저장했어요');
  };
  const loadArchive = a => { setForm({ ...defaultForm(), ...a.form, author: fixAuthor(a.form && a.form.author), profile: migrateProfile(a.form && a.form.profile) }); setOutline(a.outline); setBody(a.body); setImages([]); setStep(3); setView('write'); notify('보관함 글을 불러왔어요'); };
  const resetAll = () => setModal({ type: 'confirm', title: '새 글 시작', msg: '현재 작성 중인 주제·아웃라인·본문을 지우고 새로 시작할까요? (명함 정보는 유지됩니다)', okText: '새로 시작', onOk: () => { setForm(f => ({ ...defaultForm(), author: f.author, profile: f.profile, profilePos: f.profilePos })); setOutline(null); setBody(''); setImages([]); setCardMade(false); setStep(1); } });

  const canGo = s => s === 1 || (s === 2 && outline) || (s === 3 && body);
  const groups = ['AI 글쓰기', '도구'];

  return (<div className="min-h-screen flex">
    {/* 사이드바 */}
    {navOpen && <div className="fixed inset-0 bg-black/30 z-30 lg:hidden" onClick={() => setNavOpen(false)} />}
    <aside className={`fixed lg:sticky top-0 left-0 z-40 h-screen w-64 bg-white border-r border-[#ECEEF3] flex flex-col transition-transform ${navOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
      <div className="px-5 py-5 border-b border-[#ECEEF3]">
        <div className="flex items-center gap-2.5"><div className="w-9 h-9 shrink-0 rounded-xl bg-[#5B4BDB] text-white flex items-center justify-center font-extrabold text-[15px]">is</div>
          <div className="min-w-0"><p className="font-extrabold leading-tight text-[13px] break-all">부동산이즈경주역신도시부동산공인중개사사무소</p><p className="text-xs text-gray-400 font-bold mt-0.5">블로그 스튜디오</p></div></div>
      </div>
      <nav className="flex-1 p-3 overflow-y-auto">
        {groups.map(g => (<div key={g} className="mb-4"><p className="px-3 text-[11px] font-extrabold text-gray-400 mb-1.5">{g}</p>
          {NAV.filter(n => n.group === g).map(n => (<button key={n.id} disabled={n.soon} onClick={() => { setView(n.id); setNavOpen(false); }}
            className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-[15px] font-bold mb-0.5 ${view === n.id ? 'bg-[#F1EFFF] text-[#5B4BDB]' : n.soon ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50'}`}>
            <Icon n={n.icon} s={17} /><span className="flex-1 text-left">{n.label}</span>
            {n.soon && <span className="text-[10px] font-extrabold bg-gray-100 text-gray-400 px-1.5 py-0.5 rounded">준비 중</span>}
            {n.id === 'archive' && archive.length > 0 && <span className="text-[11px] font-extrabold bg-[#5B4BDB] text-white px-1.5 rounded-full">{archive.length}</span>}
          </button>))}</div>))}
      </nav>
      <div className="p-4 border-t border-[#ECEEF3] space-y-2">
        <p className="px-1 text-[11px] font-extrabold text-gray-400">인스타그램</p>
        <button onClick={() => { setView('card'); setNavOpen(false); }}
          className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-[15px] font-bold border ${view === 'card' ? 'bg-[#5B4BDB] text-white border-[#5B4BDB]' : 'bg-[#F1EFFF] text-[#5B4BDB] border-[#E3E0FA] hover:border-[#5B4BDB]'}`}>
          <Icon n="image" s={17} /><span className="flex-1 text-left">카드뉴스 생성기</span><Icon n="right" s={15} /></button>
        <button className="btn btn-o w-full justify-center" onClick={() => { setKeyDraft(''); setModal({ type: 'settings' }); }}><Icon n="key" />{apiKey ? 'API 연결됨' : 'Claude API 설정'}{apiKey && <span className="w-2 h-2 rounded-full bg-[#22B573]" />}</button>
        <p className="text-[11px] text-gray-400 text-center">{savedAt ? `자동 임시저장 ${savedAt.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}` : '입력 내용은 이 브라우저에 자동 저장됩니다'}</p>
      </div>
    </aside>

    {/* 본문 */}
    <main className="flex-1 min-w-0">
      <header className="bg-white/90 backdrop-blur border-b border-[#ECEEF3] sticky top-0 z-20">
        <div className="px-4 sm:px-6 py-3 flex items-center gap-3">
          <button className="lg:hidden p-2 -ml-2" onClick={() => setNavOpen(true)}><Icon n="menu" s={20} /></button>
          <div className="flex-1 min-w-0"><p className="text-xs text-gray-400 font-bold">{view === 'archive' ? '도구' : view === 'card' ? '인스타그램' : 'AI 글쓰기'}</p><h1 className="font-extrabold text-lg truncate">{view === 'archive' ? '보관함' : view === 'card' ? '카드뉴스 생성기' : '정보성 블로그 (부동산)'}</h1></div>
          {view === 'write' && <button className="btn btn-o btn-s" onClick={resetAll}><Icon n="refresh" s={14} />새 글</button>}
        </div>
        {view === 'write' && <div className="px-4 sm:px-6 pb-3 flex items-center gap-1 sm:gap-2 overflow-x-auto">
          {STEPS.map((s, i) => { const n = i + 1; const on = step === n; const done = step > n; return (<React.Fragment key={s}>
            <button disabled={!canGo(n)} onClick={() => setStep(n)} className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-bold whitespace-nowrap ${on ? 'bg-[#5B4BDB] text-white' : done ? 'bg-[#E8F8F0] text-[#16774b]' : 'bg-gray-100 text-gray-400'} disabled:cursor-not-allowed`}>
              <span className={`w-5 h-5 rounded-full text-[11px] flex items-center justify-center ${on ? 'bg-white text-[#5B4BDB]' : done ? 'bg-[#22B573] text-white' : 'bg-white'}`}>{done ? <Icon n="check" s={12} /> : n}</span>Step {n} {s}</button>
            {i < 2 && <Icon n="right" s={16} c="text-gray-300 shrink-0" />}</React.Fragment>); })}
        </div>}
      </header>
      {cardOpened && <CardNews apiKey={apiKey} active={view === 'card'} />}
      <div className="p-4 sm:p-6 max-w-[1500px] mx-auto" style={view === 'card' ? { display: 'none' } : undefined}>
        {view === 'archive' ? <Archive archive={archive} setArchive={setArchive} onLoad={loadArchive} notify={notify} /> :
          step === 1 ? <Step1 form={form} setForm={setForm} onGen={onGen} busy={busy} apiReady={!!apiKey} notify={notify} /> :
            step === 2 ? <Step2 form={form} outline={outline} setOutline={setOutline} onGen={onGen} busy={busy} apiReady={!!apiKey} back={() => setStep(1)} /> :
              <Step3 form={form} outline={outline} body={body} setBody={setBody} images={images} setImages={setImages} cardMade={cardMade} setCardMade={setCardMade} onGen={onGen} busy={busy} apiReady={!!apiKey} notify={notify} openModal={openModal} saveArchive={saveArchive} ev={ev} apiKey={apiKey} model={model} runImprove={runImprove} />}
        <p className="text-center text-xs text-gray-400 mt-10 mb-4">세금·정책·시세 수치는 반드시 공식 자료로 확인 후 발행하세요. 이 도구는 검색 순위를 보장하지 않습니다.</p>
      </div>
      <footer className="bg-white border-t border-[#ECEEF3] mt-2">
        <div className="max-w-[1500px] mx-auto px-4 sm:px-6 py-7 flex flex-col md:flex-row md:items-center justify-between gap-5">
          <div className="flex items-center gap-3.5 min-w-0">
            <div className="w-11 h-11 shrink-0 rounded-xl bg-[#5B4BDB] text-white flex items-center justify-center font-extrabold text-[17px] tracking-tight">is</div>
            <div className="min-w-0">
              <p className="text-[11px] font-extrabold text-[#5B4BDB] tracking-wide">부동산is</p>
              <p className="font-extrabold text-[15px] sm:text-base text-gray-800 break-all leading-snug">부동산이즈경주역신도시부동산공인중개사사무소</p>
            </div>
          </div>
          <dl className="flex flex-wrap md:justify-end gap-2 text-sm md:max-w-[60%]">
            <div className="flex items-center gap-2 bg-[#F7F8FA] rounded-lg px-3.5 py-2"><dt className="text-xs font-bold text-gray-400">대표</dt><dd className="font-extrabold text-gray-700">이선예</dd></div>
            <div className="flex items-center gap-2 bg-[#F7F8FA] rounded-lg px-3.5 py-2"><dt className="text-xs font-bold text-gray-400">중개사무소 등록번호</dt><dd className="font-extrabold text-gray-700 tabular-nums">47130-2017-00023</dd></div>
            <div className="flex items-center gap-2 bg-[#F7F8FA] rounded-lg px-3.5 py-2"><dt className="text-xs font-bold text-gray-400 shrink-0">소재지</dt><dd className="font-extrabold text-gray-700 break-keep">경주시 건천읍 경주역세권1로90, 상가132동 201호 (신경주유보라104동앞)</dd></div>
          </dl>
        </div>
        <div className="border-t border-[#F1F2F5]">
          <p className="max-w-[1500px] mx-auto px-4 sm:px-6 py-3 text-[11px] text-gray-400">© {new Date().getFullYear()} 부동산이즈경주역신도시부동산공인중개사사무소. All rights reserved.</p>
        </div>
      </footer>
    </main>

    {/* 모달 */}
    {modal && modal.type === 'paste' && <Modal wide title={modal.title || (modal.kind === 'outline' ? '아웃라인: 프롬프트 복사 & 결과 붙여넣기' : '본문: 프롬프트 복사 & 결과 붙여넣기')} onClose={() => setModal(null)}
      footer={<><button className="btn btn-o" onClick={() => setModal(null)}>닫기</button><button className="btn btn-g" disabled={!pasteVal.trim()} onClick={() => { if (applyResult(modal.kind, pasteVal)) setModal(null); }}><Icon n="check" />붙여넣은 결과 적용</button></>}>
      <ol className="flex flex-wrap gap-2 text-xs font-bold mb-4">{['① 프롬프트 복사', '② Claude·ChatGPT에 붙여넣고 실행', '③ 답변 전체를 아래에 붙여넣기'].map(s => <li key={s} className="bg-[#F1EFFF] text-[#5B4BDB] px-2.5 py-1 rounded-full">{s}</li>)}</ol>
      <div className="flex items-center justify-between mb-1.5"><label className="lbl !mb-0">생성 프롬프트</label>
        <div className="flex gap-2"><a className="btn btn-o btn-s" href="https://claude.ai/new" target="_blank" rel="noopener"><Icon n="ext" s={13} />Claude 열기</a><a className="btn btn-o btn-s" href="https://chatgpt.com" target="_blank" rel="noopener"><Icon n="ext" s={13} />ChatGPT 열기</a>
          <button className="btn btn-p btn-s" onClick={async () => { const ok = await copyText(modal.prompt); notify(ok ? '프롬프트가 복사되었어요' : '복사 실패 — 직접 선택해 복사하세요', ok ? 'ok' : 'err'); }}><Icon n="copy" s={13} />복사</button></div></div>
      <textarea readOnly className="inp !text-[13px] font-mono bg-[#F7F8FA] scroll-thin" rows={8} value={modal.prompt} onFocus={e => e.target.select()} />
      <label className="lbl mt-4">AI 결과 붙여넣기 {modal.kind === 'outline' ? '(JSON)' : '(본문 텍스트)'}</label>
      <textarea className="inp !text-[14px] scroll-thin" rows={9} value={pasteVal} onChange={e => setPasteVal(e.target.value)} placeholder={modal.kind === 'outline' ? '{"titles": [...], "sections": [...] ...} 형태의 답변을 그대로 붙여넣으세요' : '정보 기준일: ... 로 시작하는 본문을 붙여넣으세요 (## 제목은 ■ 소제목으로 자동 변환)'} />
    </Modal>}
    {modal && modal.type === 'settings' && <Modal title="Claude API 연결 (선택)" onClose={() => setModal(null)}
      footer={<>{apiKey && <button className="btn btn-o text-red-500" onClick={() => { setApiKey(''); try { sessionStorage.removeItem('llbs-key'); } catch (e) {} notify('API 키를 지웠어요'); setModal(null); }}>키 삭제</button>}
        <button className="btn btn-p" disabled={!keyDraft.trim() && !apiKey} onClick={() => { const k = keyDraft.trim() || apiKey; setApiKey(k); try { sessionStorage.setItem('llbs-key', k); sessionStorage.setItem('llbs-model', model); } catch (e) {} notify('API 설정을 저장했어요 (이 탭을 닫으면 사라집니다)'); setModal(null); }}>저장</button></>}>
      <div className="space-y-4 text-[15px]">
        <Field label="Anthropic API Key" hint={apiKey ? `현재 연결됨: ${apiKey.slice(0, 10)}…` : 'sk-ant-로 시작하는 키'}><input type="password" className="inp" value={keyDraft} onChange={e => setKeyDraft(e.target.value)} placeholder="sk-ant-..." autoComplete="off" /></Field>
        <Field label="모델" hint="예: claude-sonnet-5-5, claude-haiku-5-5"><input className="inp" value={model} onChange={e => setModel(e.target.value)} /></Field>
        <div className="text-sm bg-[#F7F8FA] rounded-lg p-3 leading-relaxed text-gray-600">
          <p>• 키는 이 브라우저 탭의 세션에만 보관되고, Anthropic API 외 다른 곳으로 전송되지 않습니다.</p>
          <p>• API 사용량만큼 본인 계정에 요금이 부과됩니다.</p>
          <p>• Claude 화면 안에서 열면 외부 연결이 막혀 있어요. API 모드는 저장된 HTML 파일을 크롬 등 브라우저로 직접 열어 사용하세요. 키가 없어도 [샘플 생성]과 [프롬프트 복사·붙여넣기]는 그대로 쓸 수 있습니다.</p>
        </div>
      </div>
    </Modal>}
    {modal && modal.type === 'confirm' && <Modal title={modal.title} onClose={() => setModal(null)}
      footer={<><button className="btn btn-o" onClick={() => { setModal(null); modal.onCancel && modal.onCancel(); }}>{modal.cancelText || '취소'}</button><button className="btn btn-p" onClick={() => { setModal(null); modal.onOk(); }}>{modal.okText || '확인'}</button></>}>
      <p className="flex gap-2 leading-relaxed"><Icon n="alert" s={20} c="text-[#E8890C] shrink-0 mt-0.5" />{modal.msg}</p>
    </Modal>}

    {toast && <div key={toast.id} className={`fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-3 rounded-xl shadow-lg text-sm font-bold text-white fade-in max-w-[92vw] ${toast.kind === 'err' ? 'bg-[#E5484D]' : 'bg-[#1F2330]'}`}>{toast.kind !== 'err' && <span className="text-[#22B573] mr-1.5">✓</span>}{toast.msg}</div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
